<div class="weight-converter rounded-[10px] bg-[#ffffff4d] p-[30px] shadow-2xl">
  <h2 class="weight-converter__heading text-[32px] font-light text-teal-700">
    Weight Converter
  </h2>
  <div
    class="weight-converter__form-control mt-[32px] flex items-center gap-[30px]">
    <label for="weight-converter__weight-input">Pounds:</label>
    <input
      id="weight-input"
      class="weight-converter__weight-input w-[400px] rounded-[5px] border-[#ffffff4d] bg-[#ffffff4d] px-[10px] py-[5px] text-[20px] outline-none"
      type="number"
      placeholder="Enter number"
      step=".1" />
  </div>
  <p
    class="weight-converter__result-text mt-[20px] font-light tracking-wider text-teal-700">
    Your weight in kg is:
    <span class="weight-converter__computed-weight"></span>
  </p>
</div>
